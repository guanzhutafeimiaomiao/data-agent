[project]
name = "insight-agent"
version = "0.1.0"
description = "LangGraph multi-agent analytics assistant with a self-correcting SQL loop"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph",
    "langchain-core",
    "pydantic",
    "pydantic-settings",
    "python-dotenv",
]

[project.optional-dependencies]
llm = ["langchain", "langchain-openai"]
api = ["fastapi", "uvicorn"]
ui = ["streamlit"]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/insight_agent"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
